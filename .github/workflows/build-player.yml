name: Build player artwork

on:
  push:
    branches: [main]
    paths:
      - player.config.json
      - tools/**
      - .github/workflows/build-player.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-player
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install Pillow

      - name: Regenerate artwork
        run: python tools/build_player.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/player-*.png assets/control-bar-*.png
          if git diff --cached --quiet; then
            echo "No artwork changes."
          else
            git commit -m "Rebuild player artwork [skip ci]"
            git push
          fi