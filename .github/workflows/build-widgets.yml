name: Build profile artwork

on:
  push:
    branches: [main]
    paths:
      - widgets/**
      - .github/workflows/build-widgets.yml
  workflow_dispatch:
    inputs:
      song_url:
        description: "Song URL (QQ Music / NetEase) to fetch before rendering"
        required: false
      start:
        description: "Loop open time m:ss (default: first lyric line)"
        required: false
      end:
        description: "Loop close time m:ss (default: start + 60s)"
        required: false

permissions:
  contents: write

concurrency:
  group: build-widgets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow and Playwright
        run: |
          pip install Pillow==12.3.0 playwright
          sudo apt-get update
          sudo apt-get install -y fonts-liberation
          playwright install chromium --with-deps

      - name: Fetch song metadata (manual runs with a URL)
        if: ${{ inputs.song_url }}
        run: |
          args=("${{ inputs.song_url }}")
          [ -n "${{ inputs.start }}" ] && args+=(--start "${{ inputs.start }}")
          [ -n "${{ inputs.end }}" ] && args+=(--end "${{ inputs.end }}")
          python widgets/player/fetch_song.py "${args[@]}"

      - name: Render player animation
        run: python widgets/player/render_clip.py

      - name: Regenerate static artwork
        run: python widgets/build_all.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ README.md
          if git diff --cached --quiet; then
            echo "No artwork changes."
          else
            git commit -m "Rebuild profile artwork [skip ci]"
            git push
          fi
